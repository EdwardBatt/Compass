name: compass

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the staleness check reads git history
      - uses: actions/checkout@v4
        with:
          repository: {{repo}}
          path: .compass-tool
{{#if pin}}          ref: {{pin}} # the Compass version this project is pinned to
{{/if}}      - uses: actions/setup-node@v4
        with:
          node-version: 22
{{#if team}}      # On a pull request, warnings cover only what it changed; errors are always project-wide.
      - if: github.event_name == 'pull_request'
        run: node .compass-tool/bin/compass.mjs lint --base origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: node .compass-tool/bin/compass.mjs lint{{else}}      - run: node .compass-tool/bin/compass.mjs lint{{/if}}
